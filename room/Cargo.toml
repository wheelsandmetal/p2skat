[package]
name = "p2skat-room"
version = "0.1.0"
edition = "2021"
description = "Room and relay server for p2skat browser tables"
publish = false

# Keep this crate independent of the game crate: no arti, ratatui or bignum code.
[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros"] }
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
serde_json = "1"
getrandom = "0.3"
